<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alta de Apunte</title>

  <!-- Materialize CSS -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">

  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <style>
    .user-info {
      margin-right: 20px;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Header/Nav -->
  <nav>
    <div class="nav-wrapper blue">
      <a href="#!" class="brand-logo" style="margin-left: 15px;">UniApuntes</a>
      <ul class="right hide-on-med-and-down">
        <li><a href="#">Perfil</a></li>
        <li><a href="#">Cargar Apunte</a></li>
        <li><a href="#">Subidos</a></li>
        <li><a href="#">Destacados</a></li>
        <li class="user-info">
          <span class="white-text">usuario@mail.com | Rango: 87 pts</span>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Formulario -->
  <div class="container">
    <h5 class="blue-text text-darken-2">Cargar nuevo apunte</h5>
    <div class="row">
      <form class="col s12">

        <!-- Universidad con Autocomplete -->
        <div class="input-field col s12">
          <input type="text" id="universidad" class="autocomplete">
          <label for="universidad">Universidad</label>
        </div>

        <!-- Carrera -->
        <div class="input-field col s12">
          <input type="text" id="carrera">
          <label for="carrera">Carrera</label>
        </div>

        <!-- Materia -->
        <div class="input-field col s12">
          <input type="text" id="materia">
          <label for="materia">Materia</label>
        </div>

        <!-- Fecha -->
        <div class="input-field col s12">
          <input type="text" class="datepicker" id="fecha">
          <label for="fecha">Fecha</label>
        </div>

        <!-- Checkbox Pago o Gratis -->
        <div class="col s12">
          <label>
            <input type="checkbox" id="esPago" />
            <span>Aplicar a pago (desmarcado = gratis)</span>
          </label>
        </div>

        <!-- Campos condicionales si es pago -->
        <div id="opcionesPago" class="col s12 hidden">
          <div class="input-field col s12">
            <input type="number" id="paginasFree">
            <label for="paginasFree">Hasta cuántas páginas son gratis</label>
          </div>
          <div class="input-field col s12">
            <input type="number" id="monto">
            <label for="monto">Monto (ARS)</label>
          </div>
        </div>

        <!-- Botón de Enviar -->
        <div class="col s12">
          <button class="btn waves-effect blue" type="submit">
            Subir Apunte
            <i class="material-icons right">upload</i>
          </button>
        </div>

      </form>
    </div>
  </div>

  <!-- Materialize JS + Autocomplete + Datepicker -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // Datepicker
      var dateElems = document.querySelectorAll('.datepicker');
      M.Datepicker.init(dateElems, {
        format: 'dd/mm/yyyy',
        i18n: { cancel: 'Cancelar', clear: 'Limpiar', done: 'Aceptar' }
      });

      // Autocomplete
      var autocompleteElems = document.querySelectorAll('.autocomplete');
      M.Autocomplete.init(autocompleteElems, {
        data: {
          "UBA - Universidad de Buenos Aires": null,
          "UNLP - La Plata": null,
          "UNC - Córdoba": null,
          "UNR - Rosario": null,
          "UNT - Tucumán": null,
          "UNL - Litoral": null,
          "UNNE - Nordeste": null,
          "UNSa - Salta": null,
          "UNSJ - San Juan": null,
          "UNS - Sur": null,
          "UNComa - Comahue": null,
          "UNRC - Río Cuarto": null,
          "UNMdP - Mar del Plata": null,
          "UNSE - Santiago del Estero": null,
          "UNVM - Villa María": null,
          "UNLa - Lanús": null,
          "UNQ - Quilmes": null,
          "UNPA - Patagonia Austral": null,
          "UNPSJB - Patagonia San Juan Bosco": null,
          "UNTREF - Tres de Febrero": null
        }
      });

      // Mostrar/Ocultar campos de pago
      const esPagoCheckbox = document.getElementById('esPago');
      const opcionesPago = document.getElementById('opcionesPago');

      esPagoCheckbox.addEventListener('change', function () {
        opcionesPago.classList.toggle('hidden', !this.checked);
      });
    });
  </script>

</body>
</html>
