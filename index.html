<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alta de Apunte</title>

  <!-- Materialize CSS -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">

  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <style>
    .user-info {
      margin-right: 20px;
    }
    .hidden {
      display: none;
    }
    .error {
      color: red;
      font-size: 0.9rem;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <!-- Header/Nav -->
  <nav>
    <div class="nav-wrapper blue">
      <a href="#!" class="brand-logo" style="margin-left: 15px;">UniApuntes</a>
      <ul class="right hide-on-med-and-down">
        <li><a href="#">Perfil</a></li>
        <li><a href="#">Cargar Apunte</a></li>
        <li><a href="#">Subidos</a></li>
        <li><a href="#">Destacados</a></li>
        <li class="user-info">
          <span class="white-text">usuario@mail.com | Rango: 87 pts</span>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Formulario -->
  <div class="container">
    <h5 class="blue-text text-darken-2">Cargar nuevo apunte</h5>
    <div class="row">
      <form class="col s12" id="apunteForm">

        <!-- Universidad con Autocomplete -->
        <div class="input-field col s12">
          <input type="text" id="universidad" class="autocomplete" required>
          <label for="universidad">Universidad</label>
        </div>

        <!-- Carrera -->
        <div class="input-field col s12">
          <input type="text" id="carrera" required>
          <label for="carrera">Carrera</label>
        </div>

        <!-- Materia -->
        <div class="input-field col s12">
          <input type="text" id="materia" required>
          <label for="materia">Materia</label>
        </div>

        <!-- Fecha -->
        <div class="input-field col s12">
          <input type="text" class="datepicker" id="fecha" required>
          <label for="fecha">Fecha</label>
        </div>

        <!-- Archivo -->
        <div class="file-field input-field col s12">
          <div class="btn blue">
            <span>Archivo</span>
            <input type="file" id="archivo" accept="application/pdf" required>
          </div>
          <div class="file-path-wrapper">
            <input class="file-path validate" type="text" placeholder="Subí un PDF">
          </div>
          <span id="fileError" class="error"></span>
        </div>

        <!-- Switch Pago o Gratis -->
        <div class="col s12 margin-top-20">
          <div class="switch">
            <label class="black-text" style="font-weight: 500; font-size: 16px;">
              <span style="margin-right: 10px;">Gratis</span>
              <input type="checkbox" id="esPago">
              <span class="lever"></span>
              <span style="margin-left: 10px;">Pago</span>
            </label>
          </div>
        </div>

        <!-- Campos condicionales si es pago -->
        <div id="opcionesPago" class="col s12 hidden">
          <div class="input-field col s12">
            <input type="number" id="paginasFree" min="0">
            <label for="paginasFree">Hasta cuántas páginas son gratis</label>
          </div>
          <div class="input-field col s12">
            <input type="number" id="monto" min="0">
            <label for="monto">Monto (ARS)</label>
          </div>
        </div>

        <!-- Botón de Enviar -->
        <div class="col s12">
          <button class="btn waves-effect blue" type="submit" style="margin-top: 20px;">
            Subir Apunte
            <i class="material-icons right">upload</i>
          </button>
        </div>

      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // Datepicker
      var dateElems = document.querySelectorAll('.datepicker');
      M.Datepicker.init(dateElems, {
        format: 'dd/mm/yyyy',
        i18n: { cancel: 'Cancelar', clear: 'Limpiar', done: 'Aceptar' }
      });

      // Autocomplete
      var autocompleteElems = document.querySelectorAll('.autocomplete');
      M.Autocomplete.init(autocompleteElems, {
        data: {
          "UBA - Universidad de Buenos Aires": null,
          "UNLP - La Plata": null,
          "UNC - Córdoba": null,
          "UNR - Rosario": null,
          "UNT - Tucumán": null,
          "UNL - Litoral": null,
          "UNNE - Nordeste": null,
          "UNSa - Salta": null,
          "UNSJ - San Juan": null,
          "UNS - Sur": null,
          "UNComa - Comahue": null,
          "UNRC - Río Cuarto": null,
          "UNMdP - Mar del Plata": null,
          "UNSE - Santiago del Estero": null,
          "UNVM - Villa María": null,
          "UNLa - Lanús": null,
          "UNQ - Quilmes": null,
          "UNPA - Patagonia Austral": null,
          "UNPSJB - Patagonia San Juan Bosco": null,
          "UNTREF - Tres de Febrero": null
        }
      });

      // Mostrar/Ocultar campos de pago
      const esPago = document.getElementById('esPago');
      const opcionesPago = document.getElementById('opcionesPago');

      esPago.addEventListener('change', () => {
        opcionesPago.classList.toggle('hidden', !esPago.checked);
      });

      // Validación de archivo
      const form = document.getElementById('apunteForm');
      const archivoInput = document.getElementById('archivo');
      const fileError = document.getElementById('fileError');

      form.addEventListener('submit', (e) => {
        const archivo = archivoInput.files[0];

        if (!archivo) {
          fileError.textContent = 'Debes subir un archivo PDF.';
          e.preventDefault();
          return;
        }

        if (archivo.type !== 'application/pdf') {
          fileError.textContent = 'El archivo debe ser un PDF.';
          e.preventDefault();
          return;
        }

        if (archivo.size > 10 * 1024 * 1024) { // 10MB
          fileError.textContent = 'El archivo no debe superar los 10MB.';
          e.preventDefault();
          return;
        }

        fileError.textContent = '';
        // Si todo está bien, se puede enviar normalmente
      });
    });
  </script>

</body>
</html>
